name: Build standalone Linux binaries

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "feat/rust-artix-setup-prototype"
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build x86_64 (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            label: gnu
          - target: x86_64-unknown-linux-musl
            label: musl
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: matrix.label == 'musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build release executable
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke-test executable
        run: |
          BIN="rust/target/${{ matrix.target }}/release/agsi"
          "$BIN" --version
          "$BIN" --hardware
          "$BIN" --plan
          file "$BIN"
          if [ "${{ matrix.label }}" = musl ]; then
            if readelf -l "$BIN" | grep -q 'INTERP'; then
              echo "Expected a statically linked musl executable, but found an ELF interpreter."
              exit 1
            fi
          fi

      - name: Package binary and checksum
        run: |
          set -eu
          LABEL="${{ matrix.label }}"
          BIN="rust/target/${{ matrix.target }}/release/agsi"
          mkdir -p "dist/agsi-${LABEL}"
          install -m 0755 "$BIN" "dist/agsi-${LABEL}/agsi"
          cat > "dist/agsi-${LABEL}/README.txt" <<EOF
          AGSI (Artix Granular System Installer) standalone Linux executable
          Architecture: x86_64
          Build target: ${{ matrix.target }}

          Run from a terminal with:
            ./agsi

          This archive contains a prebuilt executable. Rust and Cargo are
          not required on the target Artix live environment.
          EOF
          tar -C dist -czf "dist/agsi-x86_64-linux-${LABEL}.tar.gz" "agsi-${LABEL}"
          cd dist
          sha256sum "agsi-x86_64-linux-${LABEL}.tar.gz" > "agsi-x86_64-linux-${LABEL}.tar.gz.sha256"

      - name: Attest packaged archive provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/agsi-x86_64-linux-${{ matrix.label }}.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agsi-x86_64-linux-${{ matrix.label }}
          path: |
            dist/agsi-x86_64-linux-${{ matrix.label }}.tar.gz
            dist/agsi-x86_64-linux-${{ matrix.label }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/feat/rust-artix-setup-prototype' && contains(github.event.head_commit.message, '[publish-preview]'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source for GitHub CLI
        uses: actions/checkout@v4

      - name: Download both build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: agsi-x86_64-linux-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v0.1.0-test6"
          fi
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --target "${GITHUB_SHA}" --title "AGSI v0.1.0-test6 (test)" --notes "Pre-release test build from commit ${GITHUB_SHA}. Not a production release."
          gh release upload "$TAG_NAME" dist/* --clobber
