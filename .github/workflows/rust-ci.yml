name: Rust CI

permissions:
  contents: write

on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Temporary formatting pass: publish the rustfmt output so the source can be
      # committed back to the feature branch, then restore a strict check-only gate.
      - run: cargo fmt --all
      - name: Commit rustfmt output to the feature branch
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Format Rust sources with rustfmt"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-source
          path: rust/src/**/*.rs
          if-no-files-found: error
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo run -- --hardware
      - run: cargo run -- --plan
