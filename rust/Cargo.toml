[package]
name = "artix-setup"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Artix Granular System Installer — a safe, interactive Artix Linux installer prototype"

[[bin]]
name = "artix-setup"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
